plugins { id 'com.android.application' }

android {
    namespace 'com.example.streamtts'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.streamtts'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        externalNativeBuild {
            cmake {
                arguments '-DSTREAMTTS_BUILD_DEMO=OFF', '-DSTREAMTTS_BUILD_TESTS=OFF'
                cppFlags '-std=c++17 -fexceptions -frtti'
            }
        }
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }

    externalNativeBuild {
        cmake {
            // The root CMake file builds the shared C++ core and JNI bridge.
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }
}
